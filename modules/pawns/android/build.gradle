apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

android {
    compileSdkVersion 35
    namespace "com.pawns.sdk"

    defaultConfig {
        minSdkVersion 21
        targetSdkVersion 35
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

// NOTE: The repositories block here is for local IDE resolution only.
// At build time, JitPack is injected into settings.gradle by the
// withAndroidxCoreResolution config plugin.
repositories {
    mavenCentral()
    google()
    maven { url 'https://jitpack.io' }
}

configurations.all {
    resolutionStrategy {
        force 'androidx.core:core:1.13.1'
        force 'androidx.core:core-ktx:1.13.1'
    }
}

dependencies {
    implementation 'app.pawns:android-pawns-sdk:1.8.0'
    implementation "com.facebook.react:react-native:+"
}

