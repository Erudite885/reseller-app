apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

android {
    compileSdkVersion 35
    namespace "com.pawns.sdk"

    defaultConfig {
        minSdkVersion 21
        targetSdkVersion 35
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }
}

repositories {
    maven { url 'https://jitpack.io' }
}

configurations.all {
    // Pawns SDK pulls in androidx.core:1.17.0 which requires compileSdk 36 + AGP 8.9.1.
    // Expo 53 uses compileSdk 35 + AGP 8.8.2, so we force a compatible version here.
    resolutionStrategy {
        force 'androidx.core:core:1.13.1'
        force 'androidx.core:core-ktx:1.13.1'
    }
}

dependencies {
    implementation 'app.pawns:android-pawns-sdk:1.8.0'
    implementation "com.facebook.react:react-native:+"
}