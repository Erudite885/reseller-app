name: OTA Update

on:
  push:
    branches:
      - main
      - staging
    paths:
      - 'app/**'
      - 'components/**'
      - 'hooks/**'
      - 'store/**'
      - 'constants/**'
      - 'lib/**'
      - 'package.json'
  workflow_dispatch:
    inputs:
      store_name:
        description: 'Store name to update'
        required: true
        type: string
        default: 'reseller-data'
      config_id:
        description: 'Build Configuration ID'
        required: true
        type: string
      message:
        description: 'Update message'
        required: false
        default: 'Manual OTA update'

jobs:
  ota-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Setup Expo
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Make scripts executable
        run: chmod +x scripts/generate-reseller-assets.sh

      - name: Generate reseller assets
        run: bash scripts/generate-reseller-assets.sh
        env:
          API_URL: ${{ secrets.API_URL }}
          API_SECRET: ${{ secrets.API_SECRET_KEY }}
          CONFIG_ID: ${{ github.event.inputs.config_id }}

      - name: Publish OTA Update
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          eas update --auto \
            --platform android \
            --channel production \
            --message "${{ github.event.inputs.message || github.event.head_commit.message }}"