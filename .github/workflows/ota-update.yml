name: OTA Update

on:
  push:
    branches:
      - main
      - staging
    paths:
      - 'app/**'
      - 'components/**'
      - 'hooks/**'
      - 'store/**'
      - 'constants/**'
      - 'lib/**'
      - 'package.json'
  workflow_dispatch:
    inputs:
      store_name:
        description: 'Store name to update'
        required: true
        type: string
        default: 'reseller-data'
      config_id:
        description: 'Build Configuration ID'
        required: true
        type: string
      message:
        description: 'Update message'
        required: false
        default: 'Manual OTA update'

jobs:
  ota-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Setup Expo
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Make scripts executable
        run: chmod +x scripts/generate-reseller-assets.sh

      - name: Get completed reseller configs
        id: configs
        run: |
          SUPABASE_URL="${{ secrets.EXPO_PUBLIC_BIMBO_SUPABASE_URL }}"
          SUPABASE_URL="${SUPABASE_URL%/}"
          CONFIGS=$(curl -s "${SUPABASE_URL}/rest/v1/reseller_app_configs?select=id,config&build_status=eq.completed" \
            -H "apikey: ${{ secrets.BIMBO_SUPABASE_SECRET_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.BIMBO_SUPABASE_SECRET_KEY }}")
          echo "configs=$CONFIGS" >> $GITHUB_OUTPUT

      - name: Publish OTA for each reseller
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          API_URL: ${{ secrets.API_URL }}
          API_SECRET: ${{ secrets.API_SECRET_KEY }}
        run: |
          echo '${{ steps.configs.outputs.configs }}' | jq -c '.[]' | while read item; do
            CONFIG_ID=$(echo "$item" | jq -r '.id')
            STORE_NAME=$(echo "$item" | jq -r '.config.storeName')
            
            echo "Publishing OTA for $STORE_NAME (config: $CONFIG_ID)"
            
            bash scripts/generate-reseller-assets.sh
            
            eas update --auto \
              --platform android \
              --channel production \
              --message "${{ github.event.inputs.message || github.event.head_commit.message }}"
          done