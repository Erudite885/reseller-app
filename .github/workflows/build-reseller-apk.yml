name: Build Reseller APK

on:
  workflow_dispatch:
    inputs:
      reseller_id:
        description: "Reseller ID"
        required: true
        type: string
      config_id:
        description: "Build Configuration ID"
        required: true
        type: string
      store_name:
        description: "Store name (used for APK filename, e.g. soledad)"
        required: true
        type: string
      environment:
        description: "Build environment"
        required: false
        type: string
        default: "production"
      version:
        description: "Version tag for release (e.g., v1.0.0, or leave empty for auto-generated)"
        required: false
        type: string
        default: ""

env:
  EXPO_PUBLIC_BIMBO_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_BIMBO_SUPABASE_URL }}
  EXPO_PUBLIC_BIMBO_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.EXPO_PUBLIC_BIMBO_SUPABASE_PUBLISHABLE_KEY }}
  EXPO_PUBLIC_PROJECT_ID: ${{ secrets.EXPO_PUBLIC_PROJECT_ID }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Firebase config
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > ./google-services.json
            echo "✅ google-services.json created from secret"
          else
            echo "❌ GOOGLE_SERVICES_JSON secret not found"
            exit 1
          fi    

      - name: Verify Firebase config exists
        run: |
          if [ -f "./google-services.json" ]; then
            echo "✅ google-services.json found"
          else
            echo "❌ google-services.json not found"
            exit 1
          fi  

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Setup Expo
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Make scripts executable
        run: chmod +x scripts/generate-reseller-assets.sh

      - name: Generate reseller assets
        run: bash scripts/generate-reseller-assets.sh
        env:
          API_URL: ${{ secrets.API_URL }}
          API_SECRET: ${{ secrets.API_SECRET_KEY }}
          CONFIG_ID: ${{ github.event.inputs.config_id }}

      # ✅ Fail fast before spending build minutes if any Xixapay secret is missing
      - name: Verify Xixapay secrets
        env:
          EXPO_PUBLIC_XIXAPAY_SECRET_KEY: ${{ secrets.EXPO_PUBLIC_XIXAPAY_SECRET_KEY }}
          EXPO_PUBLIC_XIXAPAY_API_KEY: ${{ secrets.EXPO_PUBLIC_XIXAPAY_API_KEY }}
          EXPO_PUBLIC_XIXAPAY_BUSINESS_ID: ${{ secrets.EXPO_PUBLIC_XIXAPAY_BUSINESS_ID }}
        run: |
          if [ -z "$EXPO_PUBLIC_XIXAPAY_SECRET_KEY" ]; then echo "ERROR: EXPO_PUBLIC_XIXAPAY_SECRET_KEY is empty"; exit 1; fi
          if [ -z "$EXPO_PUBLIC_XIXAPAY_API_KEY" ]; then echo "ERROR: EXPO_PUBLIC_XIXAPAY_API_KEY is empty"; exit 1; fi
          if [ -z "$EXPO_PUBLIC_XIXAPAY_BUSINESS_ID" ]; then echo "ERROR: EXPO_PUBLIC_XIXAPAY_BUSINESS_ID is empty"; exit 1; fi
          echo "All Xixapay secrets present ✓"

      # ✅ Env vars passed directly to this step so eas build --local inherits them
      - name: Build Android APK
        run: |
          eas build \
            --platform android \
            --profile production-apk \
            --local \
            --non-interactive \
            --output="./${{ github.event.inputs.store_name }}.apk"
        env:
          EXPO_PUBLIC_BIMBO_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_BIMBO_SUPABASE_URL }}
          EXPO_PUBLIC_BIMBO_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.EXPO_PUBLIC_BIMBO_SUPABASE_PUBLISHABLE_KEY }}
          EXPO_PUBLIC_XIXAPAY_SECRET_KEY: ${{ secrets.EXPO_PUBLIC_XIXAPAY_SECRET_KEY }}
          EXPO_PUBLIC_XIXAPAY_API_KEY: ${{ secrets.EXPO_PUBLIC_XIXAPAY_API_KEY }}
          EXPO_PUBLIC_XIXAPAY_BUSINESS_ID: ${{ secrets.EXPO_PUBLIC_XIXAPAY_BUSINESS_ID }}
          EXPO_PUBLIC_PROJECT_ID: ${{ secrets.EXPO_PUBLIC_PROJECT_ID }}

      # Determine release tag
      - name: Determine release tag
        id: release_tag
        run: |
          STORE_NAME="${{ github.event.inputs.store_name }}"
          CONFIG_ID="${{ github.event.inputs.config_id }}"
          TIMESTAMP=$(date +'%Y%m%d_%H%M%S')

          if [ -n "${{ github.event.inputs.version }}" ]; then
            TAG="${{ github.event.inputs.version }}"
          else
            TAG="${STORE_NAME}-${CONFIG_ID}-${TIMESTAMP}"
          fi

          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "Release tag: ${TAG}"

      # Create release and upload APK using gh CLI
      - name: Create Release and Upload APK
        id: upload_release
        env:
          GH_TOKEN: ${{ secrets.APP_RELEASE_TOKEN }}
        run: |
          STORE_NAME="${{ github.event.inputs.store_name }}"
          CONFIG_ID="${{ github.event.inputs.config_id }}"
          RESELLER_ID="${{ github.event.inputs.reseller_id }}"
          ENVIRONMENT="${{ github.event.inputs.environment }}"
          TAG="${{ steps.release_tag.outputs.tag }}"
          APK_PATH="./${STORE_NAME}.apk"

          # Verify APK exists
          if [ ! -f "$APK_PATH" ]; then
            echo "ERROR: APK file not found at $APK_PATH"
            exit 1
          fi

          # Create release notes
          RELEASE_NOTES="## Reseller APK Build

          ### Build Information
          - **Reseller ID:** ${RESELLER_ID}
          - **Config ID:** ${CONFIG_ID}
          - **Store Name:** ${STORE_NAME}
          - **Build Date:** $(date -u +"%Y-%m-%dT%H:%M:%SZ")
          - **Environment:** ${ENVIRONMENT}

          ### Download
          The APK file is attached below."

          # Create release and upload APK to tenant-distribution repo
          echo "Creating release ${TAG} in Erudite885/tenant-distribution..."

          gh release create "$TAG" \
            --repo "Erudite885/tenant-distribution" \
            --title "${STORE_NAME} - Build ${CONFIG_ID}" \
            --notes "${RELEASE_NOTES}" \
            "$APK_PATH"

          # Construct download URL
          DOWNLOAD_URL="https://github.com/Erudite885/tenant-distribution/releases/download/${TAG}/${STORE_NAME}.apk"
          echo "download_url=${DOWNLOAD_URL}" >> $GITHUB_OUTPUT
          echo "release_tag=${TAG}" >> $GITHUB_OUTPUT
          echo "✅ APK uploaded successfully to: ${DOWNLOAD_URL}"

      # Notify backend with APK URL (this will update your database via your webhook)
      - name: Notify backend
        if: success()
        run: |
          DOWNLOAD_URL="${{ steps.upload_release.outputs.download_url }}"

          echo "Notifying backend with APK URL: ${DOWNLOAD_URL}"

          curl -X POST "${{ secrets.API_URL }}/api/build-webhook" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${{ secrets.API_SECRET_KEY }}" \
            -d "{
              \"configId\": \"${{ github.event.inputs.config_id }}\",
              \"resellerId\": \"${{ github.event.inputs.reseller_id }}\",
              \"status\": \"completed\",
              \"apkUrl\": \"${DOWNLOAD_URL}\"
            }"

          echo "✅ Backend notified and database updated via webhook"

      # Notify backend of failure (optional but recommended)
      - name: Notify backend of failure
        if: failure()
        run: |
          echo "Notifying backend of build failure..."

          curl -X POST "${{ secrets.API_URL }}/api/build-webhook" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${{ secrets.API_SECRET_KEY }}" \
            -d "{
              \"configId\": \"${{ github.event.inputs.config_id }}\",
              \"resellerId\": \"${{ github.event.inputs.reseller_id }}\",
              \"status\": \"failed\"
            }" || true

      # Output summary
      - name: Build Summary
        if: success()
        run: |
          echo "========================================="
          echo "✅ BUILD COMPLETED SUCCESSFULLY"
          echo "========================================="
          echo "Store Name: ${{ github.event.inputs.store_name }}"
          echo "Config ID: ${{ github.event.inputs.config_id }}"
          echo "Reseller ID: ${{ github.event.inputs.reseller_id }}"
          echo "Release Tag: ${{ steps.upload_release.outputs.release_tag }}"
          echo "Download URL: ${{ steps.upload_release.outputs.download_url }}"
          echo "========================================="
